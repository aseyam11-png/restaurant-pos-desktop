server:
  address: ${POS_BIND_ADDRESS:127.0.0.1}
  port: ${POS_LOCAL_API_PORT:17890}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: restaurant-pos-local-api
  datasource:
    url: ${POS_DB_URL:jdbc:postgresql://127.0.0.1:5432/restaurant_pos}
    username: ${POS_DB_USERNAME:restaurant_pos}
    password: ${POS_DB_PASSWORD:}
    hikari:
      pool-name: RestaurantPosPool
      maximum-pool-size: ${POS_DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: true
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
pos:
  currency: ${POS_CURRENCY:ILS}
  security:
    local-token: ${POS_LOCAL_TOKEN:}
  cors:
    allowed-origins:
      - tauri://localhost
      - http://tauri.localhost
      - https://tauri.localhost
      - http://127.0.0.1:1420
      - http://localhost:1420
