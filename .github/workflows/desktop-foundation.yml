name: Desktop Foundation CI

on:
  push:
    branches: [main, "phase-0/**"]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-foundation.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
