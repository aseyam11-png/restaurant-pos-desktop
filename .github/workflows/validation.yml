name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate prototype JavaScript when present
        run: |
          if [ -f prototype/app.js ]; then
            node --check prototype/app.js
          else
            echo "Prototype source not present yet; skipping."
          fi
      - name: Validate prototype structure when present
        run: |
          if [ -f scripts/check_prototype.py ]; then
            python scripts/check_prototype.py
          else
            echo "Prototype checker not present yet; skipping."
          fi
